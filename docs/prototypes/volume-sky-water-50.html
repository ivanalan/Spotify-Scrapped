<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volume slide — 50 sky × water options (throwaway)</title>
  <style>
    :root {
      --page: #0e0e12;
      --panel: #1a1a22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--page);
      color: #e8e8ec;
      padding: 24px 20px 64px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 650;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .meta {
      color: #9a9aa8;
      font-size: 0.85rem;
      margin: 0 0 20px;
      max-width: 52rem;
      line-height: 1.45;
    }
    .meta code {
      font-size: 0.8em;
      background: #252530;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      margin-bottom: 18px;
      font-size: 0.82rem;
      color: #b0b0bc;
    }
    .toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .toolbar select, .toolbar button {
      background: var(--panel);
      color: #e8e8ec;
      border: 1px solid #333344;
      border-radius: 6px;
      padding: 6px 10px;
      font: inherit;
    }
    .toolbar button { cursor: pointer; }
    .toolbar button:hover { border-color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }
    .card {
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid transparent;
      background: var(--panel);
      cursor: pointer;
      transition: border-color 0.12s, transform 0.12s;
    }
    .card:hover { border-color: #55556a; transform: translateY(-1px); }
    .card.selected { border-color: #ffe66d; }
    .card.fail { opacity: 0.5; }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px;
    }
    .slide-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slide-label {
      font-size: 0.58rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8a8a98;
      text-align: center;
    }
    .preview {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 8px;
      overflow: hidden;
    }
    .sky {
      position: absolute;
      inset: 0;
    }
    .water {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      clip-path: polygon(
        0% 18%, 8% 10%, 16% 18%, 24% 8%, 32% 18%, 40% 12%,
        48% 20%, 56% 10%, 64% 18%, 72% 8%, 80% 16%, 88% 10%,
        100% 18%, 100% 100%, 0% 100%
      );
    }
    .preview.on-sky .water { height: 38%; }
    .preview.on-water .water { height: 72%; }
    .copy {
      position: absolute;
      left: 10%;
      right: 10%;
      z-index: 2;
      text-align: left;
    }
    .preview.on-sky .copy { top: 22%; }
    .preview.on-water .copy { top: 48%; }
    .copy .kicker {
      font-size: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.72;
      margin-bottom: 3px;
    }
    .copy .headline {
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 3px;
    }
    .copy .sub {
      font-size: 0.52rem;
      font-weight: 500;
      line-height: 1.35;
      opacity: 0.7;
      margin: 0;
    }
    .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 3;
      font-size: 0.52rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 999px;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .badge.pass { background: rgba(16, 120, 70, 0.85); }
    .badge.warn { background: rgba(160, 100, 0, 0.9); }
    .badge.failb { background: rgba(140, 30, 40, 0.9); }
    .info {
      padding: 4px 10px 10px;
      font-size: 0.68rem;
      line-height: 1.4;
      color: #c4c4d0;
    }
    .info strong {
      display: block;
      color: #fff;
      font-size: 0.74rem;
      margin-bottom: 2px;
    }
    .swatches {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    .swatches span {
      width: 18px;
      height: 12px;
      border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .picked {
      margin: 0 0 16px;
      padding: 10px 12px;
      background: var(--panel);
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #b8e0c8;
      white-space: pre-wrap;
      min-height: 2.4em;
      border: 1px solid #2a3a30;
    }
    .picked:empty::before {
      content: "Click a card to copy its CSS snippet here.";
      color: #6a6a78;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Slide 2 (volume) — 50 sky × water options</h1>
  <p class="meta">
    Each combo shows <strong>two</strong> vertical slides: text on sky (low tide) and text on water (high tide).
    Ink auto-picks <code>#1c1c1c</code> or <code>#f5f5f5</code> per field for best contrast.
    Badges: large ≥3:1, body ≥4.5:1. Prod: sky <code>#FFD08A → #FFB04A → #FF8F2A</code>, water <code>#5EEAD4 → #1D4ED8</code>.
  </p>

  <div class="toolbar">
    <label>
      Filter
      <select id="filter">
        <option value="all">All 50</option>
        <option value="both">Both placements AA body</option>
        <option value="sky">Sky AA body</option>
        <option value="water">Water AA body</option>
        <option value="fail">Either fails AA large</option>
      </select>
    </label>
    <button type="button" id="copyBtn">Copy selected CSS</button>
    <span id="count"></span>
  </div>

  <div class="picked" id="picked"></div>
  <div class="grid" id="grid"></div>

  <script>
    function lum(hex) {
      const c = hex.replace("#", "");
      const n = parseInt(c.length === 3
        ? c.split("").map((x) => x + x).join("")
        : c, 16);
      const r = ((n >> 16) & 255) / 255;
      const g = ((n >> 8) & 255) / 255;
      const b = (n & 255) / 255;
      const f = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
      return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
    }
    function contrast(a, b) {
      const L1 = lum(a), L2 = lum(b);
      const hi = Math.max(L1, L2), lo = Math.min(L1, L2);
      return (hi + 0.05) / (lo + 0.05);
    }
    function mixHex(a, b, t) {
      const p = (h) => {
        const c = h.replace("#", "");
        const n = parseInt(c.length === 3 ? c.split("").map((x) => x + x).join("") : c, 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      };
      const A = p(a), B = p(b);
      const r = Math.round(A[0] + (B[0] - A[0]) * t);
      const g = Math.round(A[1] + (B[1] - A[1]) * t);
      const bl = Math.round(A[2] + (B[2] - A[2]) * t);
      return "#" + [r, g, bl].map((x) => x.toString(16).padStart(2, "0")).join("");
    }
    function pickInk(bg) {
      const dark = "#1c1c1c", light = "#f5f5f5";
      return contrast(dark, bg) >= contrast(light, bg) ? dark : light;
    }
    function grade(ratio) {
      if (ratio >= 4.5) return { cls: "pass", text: `AA ${ratio.toFixed(1)}` };
      if (ratio >= 3) return { cls: "warn", text: `LG ${ratio.toFixed(1)}` };
      return { cls: "failb", text: `FAIL ${ratio.toFixed(1)}` };
    }

    const OPTIONS = [
      { id: 1,  name: "Prod ember",       sky: ["#FFD08A","#FFB04A","#FF8F2A"], water: ["#5EEAD4","#1D4ED8"] },
      { id: 2,  name: "Peach · lagoon",    sky: ["#FFE0B0","#FFC078","#FF9A45"], water: ["#5EEAD4","#0E7490"] },
      { id: 3,  name: "Apricot · gulf",    sky: ["#FFD9A0","#FFB85C","#F08A2A"], water: ["#67E8F9","#1E40AF"] },
      { id: 4,  name: "Honey · bay",       sky: ["#FFE8A8","#FFC84A","#E89A20"], water: ["#2DD4BF","#1E3A8A"] },
      { id: 5,  name: "Canteloupe",        sky: ["#FFD4A0","#FFA94D","#F07820"], water: ["#99F6E4","#155E75"] },
      { id: 6,  name: "Tangerine deep",    sky: ["#FFC878","#FF9F1C","#E86A10"], water: ["#22D3EE","#1E3A8A"] },
      { id: 7,  name: "Mango soft",        sky: ["#FFE4B8","#FFBF6B","#FF9B3D"], water: ["#67E8F9","#0369A1"] },
      { id: 8,  name: "Amber dusk",        sky: ["#FFD89A","#F0A83A","#D97706"], water: ["#5EEAD4","#164E63"] },
      { id: 9,  name: "Coral sky",         sky: ["#FFC9A8","#FF9B6B","#F06A3A"], water: ["#67E8F9","#1D4ED8"] },
      { id: 10, name: "Salmon · teal",     sky: ["#FFC4B0","#FF8F70","#E85D45"], water: ["#2DD4BF","#0F766E"] },
      { id: 11, name: "Persimmon",         sky: ["#FFC090","#FF8C42","#E85D2C"], water: ["#A5F3FC","#1E40AF"] },
      { id: 12, name: "Clay warm",         sky: ["#F5C9A0","#E89A5C","#C96A35"], water: ["#5EEAD4","#1E3A8A"] },
      { id: 13, name: "Sand · cyan",       sky: ["#F5E0B8","#E8C878","#D4A84A"], water: ["#22D3EE","#0E7490"] },
      { id: 14, name: "Butter · indigo",   sky: ["#FFE9A0","#F5C84A","#D9A020"], water: ["#818CF8","#312E81"] },
      { id: 15, name: "Gold · cobalt",     sky: ["#FFE08A","#E8B84B","#C99420"], water: ["#60A5FA","#1E3A8A"] },
      { id: 16, name: "Pale peach",        sky: ["#FFE8D0","#FFC9A0","#FFA870"], water: ["#5EEAD4","#0F766E"] },
      { id: 17, name: "Creamsicle",        sky: ["#FFE4C4","#FFB87A","#FF9448"], water: ["#67E8F9","#1D4ED8"] },
      { id: 18, name: "Sunset lip",        sky: ["#FFD0A8","#FF8F5A","#E85A30"], water: ["#22D3EE","#075985"] },
      { id: 19, name: "Hot ember",         sky: ["#FFB86B","#FF8F2A","#E85D10"], water: ["#99F6E4","#164E63"] },
      { id: 20, name: "Soft mango",        sky: ["#FFE8C0","#FFC878","#FFA84A"], water: ["#2DD4BF","#1E40AF"] },
      { id: 21, name: "Rust tip",          sky: ["#FFC8A0","#E89A55","#C96A28"], water: ["#67E8F9","#1E3A8A"] },
      { id: 22, name: "Marigold sea",      sky: ["#FFE29A","#F5B83A","#D99410"], water: ["#5EEAD4","#0E7490"] },
      { id: 23, name: "Pink sand",         sky: ["#FFD8D0","#FFB0A0","#F08A78"], water: ["#67E8F9","#0369A1"] },
      { id: 24, name: "Rose gold",         sky: ["#FFD0C0","#E8A090","#D07868"], water: ["#2DD4BF","#155E75"] },
      { id: 25, name: "Blush · navy",      sky: ["#FFD4C8","#FFA898","#E87868"], water: ["#93C5FD","#1E3A8A"] },
      { id: 26, name: "Copper glow",       sky: ["#F0C090","#D9894A","#B86028"], water: ["#5EEAD4","#1D4ED8"] },
      { id: 27, name: "Ochre tide",        sky: ["#E8D0A0","#D4A84A","#B88828"], water: ["#22D3EE","#0F766E"] },
      { id: 28, name: "Lemon peel",        sky: ["#FFF0A8","#F5D84A","#D4B020"], water: ["#67E8F9","#1E40AF"] },
      { id: 29, name: "Yolk · ocean",      sky: ["#FFE878","#F5C020","#D9A010"], water: ["#38BDF8","#1E3A8A"] },
      { id: 30, name: "Warm paper ban",    sky: ["#F8E8C8","#F0D090","#E0B060"], water: ["#2DD4BF","#164E63"] },
      { id: 31, name: "Flame soft",        sky: ["#FFC878","#FF7A3A","#E85018"], water: ["#A5F3FC","#075985"] },
      { id: 32, name: "Ember cool water",  sky: ["#FFD08A","#FFB04A","#FF8F2A"], water: ["#67E8F9","#0E7490"] },
      { id: 33, name: "Ember deep navy",   sky: ["#FFD08A","#FFB04A","#FF8F2A"], water: ["#5EEAD4","#172554"] },
      { id: 34, name: "Ember teal floor",  sky: ["#FFD08A","#FFB04A","#FF8F2A"], water: ["#99F6E4","#115E59"] },
      { id: 35, name: "Ember indigo",      sky: ["#FFD08A","#FFB04A","#FF8F2A"], water: ["#A5B4FC","#312E81"] },
      { id: 36, name: "Pale sky · wave",   sky: ["#FFE8C8","#FFD0A0","#FFB878"], water: ["#5EEAD4","#1D4ED8"] },
      { id: 37, name: "Bright mid",        sky: ["#FFC878","#FFA83A","#F08018"], water: ["#67E8F9","#1E40AF"] },
      { id: 38, name: "Muted clay",        sky: ["#E8C8A8","#D4A078","#B87850"], water: ["#2DD4BF","#0F766E"] },
      { id: 39, name: "Dusty apricot",     sky: ["#F0D0B0","#E0A878","#C88850"], water: ["#22D3EE","#1E3A8A"] },
      { id: 40, name: "Neon tip",          sky: ["#FFD878","#FF9F1C","#FF6B00"], water: ["#5EEAD4","#0E7490"] },
      { id: 41, name: "Soft gold",         sky: ["#FFE8B0","#E8C868","#D0A838"], water: ["#67E8F9","#1D4ED8"] },
      { id: 42, name: "Coral bay",         sky: ["#FFB898","#FF7A55","#E85030"], water: ["#99F6E4","#155E75"] },
      { id: 43, name: "Peach navy",        sky: ["#FFE0C0","#FFB888","#FF9470"], water: ["#60A5FA","#1E3A8A"] },
      { id: 44, name: "Amber lagoon",      sky: ["#FFD898","#F0B040","#D98818"], water: ["#2DD4BF","#134E4A"] },
      { id: 45, name: "Saffron sea",       sky: ["#FFE4A0","#F5B83A","#E09010"], water: ["#38BDF8","#1E40AF"] },
      { id: 46, name: "Grapefruit",        sky: ["#FFC8B0","#FF8F6B","#F05A40"], water: ["#67E8F9","#0369A1"] },
      { id: 47, name: "Warm gray ban",     sky: ["#E8D8C8","#D4B898","#C0A078"], water: ["#5EEAD4","#1D4ED8"] },
      { id: 48, name: "Bright aqua lip",   sky: ["#FFD08A","#FFB04A","#FF8F2A"], water: ["#CCFBF1","#0F766E"] },
      { id: 49, name: "Midnight water",    sky: ["#FFD08A","#FFB04A","#FF8F2A"], water: ["#22D3EE","#0C1A3A"] },
      { id: 50, name: "Vivid pair",        sky: ["#FFE0A0","#FF9F1C","#E85D10"], water: ["#5EEAD4","#1D4ED8"] },
    ];

    let selected = null;

    function enrich(o) {
      const skyBg = o.sky[1];
      // Text sits mid-band of the water fill (crest → deep mix)
      const waterBg = mixHex(o.water[0], o.water[1], 0.35);
      const inkSky = pickInk(skyBg);
      const inkWater = pickInk(waterBg);
      const ratioSky = contrast(inkSky, skyBg);
      const ratioWater = contrast(inkWater, waterBg);
      return {
        ...o,
        skyBg,
        waterBg,
        inkSky,
        inkWater,
        ratioSky,
        ratioWater,
        skyBodyOk: ratioSky >= 4.5,
        skyLargeOk: ratioSky >= 3,
        waterBodyOk: ratioWater >= 4.5,
        waterLargeOk: ratioWater >= 3,
        bothBodyOk: ratioSky >= 4.5 && ratioWater >= 4.5,
      };
    }

    const data = OPTIONS.map(enrich);

    function cssSnippet(o) {
      return [
        `/* #${String(o.id).padStart(2,"0")} ${o.name} */`,
        `EMBER_FIELD_GRADIENT = "linear-gradient(165deg, ${o.sky[0]} 0%, ${o.sky[1]} 45%, ${o.sky[2]} 100%)"`,
        `ocean crest → deep: ${o.water[0]} → ${o.water[1]}`,
        `ink on sky:   ${o.inkSky}   (${o.ratioSky.toFixed(2)}:1)`,
        `ink on water: ${o.inkWater} (${o.ratioWater.toFixed(2)}:1)`,
      ].join("\n");
    }

    function slideHtml(o, placement) {
      const onSky = placement === "sky";
      const ink = onSky ? o.inkSky : o.inkWater;
      const ratio = onSky ? o.ratioSky : o.ratioWater;
      const g = grade(ratio);
      const waterH = onSky ? "38%" : "72%";
      const waterGrad = `linear-gradient(180deg,${o.water[0]} 0%,${mixHex(o.water[0], o.water[1], 0.45)} 40%,${o.water[1]} 100%)`;
      const skyGrad = `linear-gradient(165deg,${o.sky[0]} 0%,${o.sky[1]} 45%,${o.sky[2]} 100%)`;
      return `
        <div class="slide-wrap">
          <div class="slide-label">${onSky ? "Text on sky" : "Text on water"}</div>
          <div class="preview ${onSky ? "on-sky" : "on-water"}">
            <div class="sky" style="background:${skyGrad}"></div>
            <div class="water" style="height:${waterH};background:${waterGrad}"></div>
            <div class="badge ${g.cls}">${g.text}</div>
            <div class="copy" style="color:${ink}">
              <div class="kicker">Scrapped</div>
              <p class="headline">You liked<br>a lot.</p>
              <p class="sub">Sample body — contrast vs ${onSky ? "sky mid" : "water mid"}.</p>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const filter = document.getElementById("filter").value;
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      let shown = 0;

      for (const o of data) {
        let hide = false;
        if (filter === "both" && !o.bothBodyOk) hide = true;
        if (filter === "sky" && !o.skyBodyOk) hide = true;
        if (filter === "water" && !o.waterBodyOk) hide = true;
        if (filter === "fail" && o.skyLargeOk && o.waterLargeOk) hide = true;
        if (hide) continue;
        shown++;

        const el = document.createElement("div");
        el.className = "card"
          + (o.bothBodyOk ? "" : " fail")
          + (selected === o.id ? " selected" : "");
        el.innerHTML = `
          <div class="pair">
            ${slideHtml(o, "sky")}
            ${slideHtml(o, "water")}
          </div>
          <div class="info">
            <strong>#${String(o.id).padStart(2,"0")} · ${o.name}</strong>
            sky ${o.ratioSky.toFixed(2)} · water ${o.ratioWater.toFixed(2)}
            <div class="swatches">
              <span style="background:${o.sky[0]}" title="sky top"></span>
              <span style="background:${o.sky[1]}" title="sky mid"></span>
              <span style="background:${o.sky[2]}" title="sky bottom"></span>
              <span style="background:${o.water[0]}" title="crest"></span>
              <span style="background:${o.water[1]}" title="deep"></span>
            </div>
          </div>
        `;
        el.addEventListener("click", () => {
          selected = o.id;
          document.getElementById("picked").textContent = cssSnippet(o);
          render();
        });
        grid.appendChild(el);
      }
      document.getElementById("count").textContent = `${shown} shown`;
    }

    document.getElementById("filter").addEventListener("change", render);
    document.getElementById("copyBtn").addEventListener("click", async () => {
      const t = document.getElementById("picked").textContent;
      if (!t) return;
      await navigator.clipboard.writeText(t);
      document.getElementById("copyBtn").textContent = "Copied";
      setTimeout(() => { document.getElementById("copyBtn").textContent = "Copy selected CSS"; }, 1200);
    });

    render();
  </script>
</body>
</html>
