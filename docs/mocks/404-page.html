<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 page · B orchid wash (locked layout)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #12101a;
        --paper: #f5f5f5;
        --muted: color-mix(in oklab, #f5f5f5 70%, transparent);
        --accent: #c9a0f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
        background: #0a0910;
        color: var(--paper);
        -webkit-font-smoothing: antialiased;
      }

      .board {
        padding: 2rem 1.5rem 4rem;
        max-width: 480px;
        margin: 0 auto;
      }

      .board-head {
        margin-bottom: 1.5rem;
      }

      .board-head h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .board-head h1 em {
        font-style: italic;
        color: var(--accent);
      }

      .board-head p {
        margin: 0.55rem 0 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: color-mix(in oklab, #f5f5f5 68%, transparent);
      }

      .label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.75rem;
      }

      .phone {
        position: relative;
        width: 100%;
        max-width: 340px;
        aspect-ratio: 9 / 19.5;
        border-radius: 1.75rem;
        overflow: hidden;
        border: 1px solid color-mix(in oklab, #f5f5f5 14%, transparent);
        box-shadow: 0 24px 60px color-mix(in oklab, #000 55%, transparent);
      }

      .field {
        position: absolute;
        inset: 0;
        background-color: var(--ink);
        background-image:
          radial-gradient(
            120% 80% at 0% 0%,
            color-mix(in oklab, #6b21a8 20%, transparent) 0%,
            transparent 65%
          ),
          radial-gradient(
            100% 70% at 100% 100%,
            color-mix(in oklab, #3b0764 14%, transparent) 0%,
            transparent 60%
          );
      }

      .page {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        height: 100%;
        padding: 2.25rem 2rem 2rem;
      }

      .brand {
        margin: 0;
        flex-shrink: 0;
        font-size: 1.15rem;
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
      }

      .mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }

      .headline {
        margin: 0;
        font-size: 1.85rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .blurb {
        margin: 0.75rem 0 0;
        font-size: 0.95rem;
        line-height: 1.45;
        color: var(--muted);
        max-width: 16rem;
      }

      .btn {
        margin-top: 1.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.5rem;
        padding: 0 1.25rem;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: default;
        background: var(--paper);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="board">
      <header class="board-head">
        <h1>404 · B locked · <em>Scrapped</em></h1>
        <p>
          Orchid wash · logo top · center aligned · one Go home button.
        </p>
      </header>

      <div class="label">B · Orchid wash</div>
      <div class="phone">
        <div class="field" aria-hidden="true"></div>
        <div class="page">
          <p class="brand">Scrapped</p>
          <div class="mid">
            <h2 class="headline">Page not found</h2>
            <p class="blurb">Nothing lives at this URL.</p>
            <button type="button" class="btn">Go home</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
